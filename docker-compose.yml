# 生产部署：app + Postgres + Redis。
# 本地开发只跑 app（默认 SQLite + 进程内限流）也可以；配了 LEGALQA_DATABASE_URL
# 才切 Postgres、LEGALQA_REDIS_URL 才切 Redis（多 worker 共享限流）。
name: legalqa

services:
  app:
    build: .
    container_name: legalqa
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - LEGALQA_COOKIE_SECURE=0   # HTTPS 反向代理下改 1
      - LEGALQA_DATABASE_URL=postgresql://legalqa:${POSTGRES_PASSWORD:-legalqa}@postgres:5432/legalqa
      - LEGALQA_REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # 只挂运行期写入的子目录：整卷挂 /app/data 会把镜像里的 corpus/eval 遮蔽掉
      - legalqa-imports:/app/data/imports
      - legalqa-backups:/app/data/backups
      # 索引默认用命名卷（空则首次启动自动重建）；也可把宿主机索引目录传进来：
      #   LEGALQA_INDEX_MOUNT=D:/git仓库/法律问答/data/index docker compose up -d
      - ${LEGALQA_INDEX_MOUNT:-legalqa-index}:/app/data/index
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg17
    container_name: legalqa-postgres
    environment:
      POSTGRES_USER: legalqa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-legalqa}
      POSTGRES_DB: legalqa
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - legalqa-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legalqa -d legalqa"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: legalqa-redis
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - legalqa-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  legalqa-index:
  legalqa-imports:
  legalqa-backups:
  legalqa-pg:
  legalqa-redis:
