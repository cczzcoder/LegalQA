[project]
name = "legalqa"
version = "0.1.0"
description = "基于 LangGraph 的长对话法律问答系统（阶段 0：只读链路）"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "langchain-openai>=0.3",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "httpx>=0.27"]
web = ["fastapi>=0.162", "uvicorn>=0.54", "python-multipart>=0.0.9"]
local = ["langchain-ollama>=0.2", "langchain-huggingface>=0.1", "sentence-transformers>=3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["legalqa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
