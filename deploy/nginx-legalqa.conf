# LegalQA 反向代理示例（nginx + certbot HTTPS）。
# 使用：把域名改成你的；证书目录由 `certbot certonly --nginx -d 域名` 生成。

server {
    listen 80;
    server_name legalqa.example.com;
    # certbot 会改写这里为 443 配置，此处先留 http 跳转
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name legalqa.example.com;

    ssl_certificate     /etc/letsencrypt/live/legalqa.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/legalqa.example.com/privkey.pem;

    # SSE 聊天流必须关缓冲，否则回答会憋到整段结束才到前端
    location /api/sessions/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;   # 文献导入上限 20MB，留余量
    }
}
